  foreach ($products as $product) { include 'components/product-card.php'; }

<article class="product-card card h-100 border-0">
  <div class="product-card__media position-relative">
    <a
      class="product-card__image-link d-block"
      href="{{product_url}}"
      aria-label="{{product_name}}"
    >
      <img
        class="product-card__image img-fluid w-100"
        src="{{product_image}}"
        alt="{{product_name}}"
        loading="lazy"
      />
    </a>
  </div>

  <div class="product-card__body card-body d-flex flex-column">
    <div class="product-card__rating">
      <span
        class="product-card__rating-stars"
        aria-label="��nh gi� {{product_rating}}"
      >
        &#9733;&#9733;&#9733;&#9733;&#9734;
      </span>
      <span class="product-card__rating-value">{{product_rating}}</span>
    </div>

    <h3 class="product-card__title">
      <a href="{{product_url}}">{{product_name}}</a>
    </h3>

    <div class="product-card__price-group">
      <span class="product-card__price">{{product_price}}</span>
      <!-- Optional old price: remove or leave empty when product is not on sale -->
      <span class="product-card__old-price">{{product_old_price}}</span>
    </div>

    <div class="product-card__actions mt-auto">
      <button
        class="product-card__add btn btn-sm"
        type="button"
        aria-label="Add {{product_name}} to cart"
      >
        <i class="fa-solid fa-cart-plus" aria-hidden="true"></i>
        <span>Th�m v�o gi?</span>
      </button>
    </div>
  </div>
</article>
