<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearVision | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Public+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../assets/css/homepage.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
  </head>
  <body class="register-body">
    <div class="page-shell auth-page">
      <main class="auth-main">
        <div class="site-container auth-container">
          <section
            class="auth-card auth-card--register"
            aria-labelledby="register-title"
          >
            <h1 class="auth-title" id="register-title">Tạo tài khoản</h1>
            <form class="row g-3 auth-form">
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="register-name"
                  >Họ và tên</label
                >
                <input
                  class="form-control form-control-lg"
                  id="register-name"
                  type="text"
                  placeholder="Nguyễn Văn A"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="register-phone"
                  >Số điện thoại</label
                >
                <input
                  class="form-control form-control-lg"
                  id="register-phone"
                  type="tel"
                  placeholder="0901 234 567"
                />
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold" for="register-email"
                  >Email</label
                >
                <input
                  class="form-control form-control-lg"
                  id="register-email"
                  type="email"
                  placeholder="vana.nguyen@example.com"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="register-password"
                  >Mật khẩu</label
                >
                <input
                  class="form-control form-control-lg"
                  id="register-password"
                  type="password"
                  placeholder="••••••••"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="register-confirm"
                  >Xác nhận mật khẩu</label
                >
                <input
                  class="form-control form-control-lg"
                  id="register-confirm"
                  type="password"
                  placeholder="••••••••"
                />
              </div>
              <div class="col-12">
                <button
                  class="btn btn-warning btn-lg text-white fw-semibold w-100 auth-submit"
                  type="submit"
                >
                  Tạo tài khoản
                </button>
              </div>
              <p class="mb-0 text-secondary text-center">
                Đã có tài khoản?
                <a href="./login.html" class="createAcc">Đăng nhập ngay</a>
              </p>
            </form>
          </section>
        </div>
      </main>
    </div>

    <script src="../assets/js/public-nav.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
