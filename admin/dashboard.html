<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearVision | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Public+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-sidebar__brand">
          <a
            class="admin-brand"
            href="./dashboard.html"
            aria-label="ClearVision Admin"
          >
            <img
              class="admin-brand__mark"
              src="../assets/images/common/logo.png"
              alt="ClearVision logo"
            />
            <span class="admin-brand__text">
              <span class="admin-brand__text-main">CLEAR</span
              ><span class="admin-brand__text-accent">VISION</span>
            </span>
          </a>
        </div>

        <button
          class="admin-menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="admin-nav"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
          <span>Menu quản trị</span>
        </button>

        <nav class="admin-nav" id="admin-nav" aria-label="Quản trị viên">
          <a class="admin-nav__item is-active" href="./dashboard.html">
            <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
            <span>Tổng quan</span>
          </a>
          <a class="admin-nav__item" href="./products-manage.html">
            <i class="fa-solid fa-glasses" aria-hidden="true"></i>
            <span>Sản phẩm</span>
          </a>
          <a class="admin-nav__item" href="./promotions-manage.html">
            <i class="fa-solid fa-tag" aria-hidden="true"></i>
            <span>Khuyến mãi</span>
          </a>
          <a class="admin-nav__item" href="./orders-manage.html">
            <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            <span>Đơn hàng</span>
          </a>
          <a class="admin-nav__item" href="./customers-manage.html">
            <i class="fa-solid fa-user-group" aria-hidden="true"></i>
            <span>Người dùng</span>
          </a>
          <a class="admin-nav__item" href="./refunds-manage.html">
            <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
            <span>Đổi trả</span>
          </a>
          <a class="admin-nav__item" href="./reports.html">
            <i class="fa-solid fa-chart-column" aria-hidden="true"></i>
            <span>Báo cáo</span>
          </a>
        </nav>

        <div class="admin-sidebar__footer">
          <div class="admin-user-card">
            <div class="admin-user-card__avatar">
              <i class="fa-solid fa-user-tie" aria-hidden="true"></i>
            </div>
            <div class="admin-user-card__meta">
              <strong>Linh Nguyen</strong>
              <span>Quản trị viên</span>
            </div>
            <button
              class="admin-user-card__action"
              type="button"
              aria-label="Đăng xuất"
            >
              <i
                class="fa-solid fa-arrow-right-from-bracket"
                aria-hidden="true"
              ></i>
            </button>
          </div>
          <a class="admin-store-link" href="../pages/homepage.html">
            <i class="fa-solid fa-store" aria-hidden="true"></i>
            <span>Quay lại cửa hàng</span>
          </a>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-topbar">
          <h1>Tổng quan</h1>
          <div class="admin-topbar__actions">
            <button
              class="admin-icon-button"
              type="button"
              aria-label="Thông báo"
            >
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
            </button>
            <button
              class="admin-icon-button"
              type="button"
              aria-label="Tin nhắn"
            >
              <i class="fa-regular fa-message" aria-hidden="true"></i>
            </button>
          </div>
        </header>

        <section class="admin-content">
          <section class="admin-stats" aria-label="Thống kê nhanh">
            <article class="admin-stat-card">
              <p>ĐƠN HÀNG</p>
              <strong data-week-orders>1,284</strong>
            </article>
            <article class="admin-stat-card">
              <p>DOANH THU</p>
              <strong data-week-revenue>15.4M</strong>
            </article>
            <article class="admin-stat-card">
              <p>SẢN PHẨM</p>
              <strong data-week-products>452</strong>
            </article>
            <article class="admin-stat-card">
              <p>KHÁCH HÀNG</p>
              <strong data-week-customers>86</strong>
            </article>
          </section>
        </section>
      </main>
    </div>

    <script src="../assets/js/admin.js"></script>
  </body>
</html>
